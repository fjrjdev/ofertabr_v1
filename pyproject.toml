[tool.poetry]
name = "ofertabr-v1"
version = "0.1.0"
description = "Newsletter API with web scraping"
authors = ["Your Name <email@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
sqlalchemy = "^2.0.35"
alembic = "^1.13.0"
asyncpg = "^0.29.0"
psycopg2-binary = "^2.9.9"
pydantic = "^2.9.0"
pydantic-settings = "^2.5.0"
celery = {extras = ["redis"], version = "^5.4.0"}
redis = "^5.0.0"
scrapy = "^2.11.0"
httpx = "^0.27.0"
email-validator = "^2.2.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.6.0"
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
ipython = "^8.27.0"
black = "^24.0.0"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"