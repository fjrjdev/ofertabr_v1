<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background-color: #f5f5f5;
        -webkit-font-smoothing: antialiased;
      }
      .email-container {
        max-width: 600px;
        margin: 0 auto;
        background-color: #ffffff;
      }
      .header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #ffffff;
        padding: 30px 20px;
        text-align: center;
      }
      .header h1 {
        margin: 0;
        font-size: 28px;
        font-weight: 700;
      }
      .intro {
        padding: 25px 20px;
        text-align: center;
        background-color: #fafafa;
        border-bottom: 1px solid #e0e0e0;
      }
      .intro p {
        margin: 0;
        color: #555;
        font-size: 16px;
      }
      .products-container {
        padding: 20px 10px;
      }
      .product-card {
        background: #ffffff;
        border: 1px solid #e0e0e0;
        border-radius: 12px;
        margin: 0 10px 20px;
        overflow: hidden;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        transition: transform 0.2s, box-shadow 0.2s;
      }
      .product-card:hover {
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
      }
      .product-image {
        width: 100%;
        height: 280px;
        background-color: #f9f9f9;
        display: block;
        border-bottom: 1px solid #e0e0e0;
        object-fit: cover;
      }
      .product-content {
        padding: 20px;
      }
      .product-title {
        font-size: 16px;
        font-weight: 600;
        color: #222;
        margin: 0 0 15px 0;
        line-height: 1.4;
        min-height: 44px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .badges {
        display: flex;
        gap: 8px;
        margin-bottom: 15px;
        flex-wrap: wrap;
      }
      .badge {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 4px;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .badge-discount {
        background-color: #ff4757;
        color: #ffffff;
      }
      .badge-free-shipping {
        background-color: #2ecc71;
        color: #ffffff;
      }
      .price-section {
        margin: 15px 0;
      }
      .old-price {
        font-size: 14px;
        color: #999;
        text-decoration: line-through;
        margin-bottom: 5px;
      }
      .current-price {
        font-size: 32px;
        font-weight: 700;
        color: #667eea;
        margin: 5px 0;
        line-height: 1;
      }
      .installments {
        font-size: 13px;
        color: #666;
        margin-top: 8px;
      }
      .installments strong {
        color: #2ecc71;
        font-weight: 600;
      }
      .cta-button {
        display: block;
        width: 100%;
        padding: 14px 20px;
        background: linear-gradient(135deg, #283593 0%, #1976d2 100%);
        color: #fff !important;
        text-align: center;
        text-decoration: none;
        border-radius: 8px;
        font-weight: 700;
        font-size: 17px;
        margin-top: 15px;
        background-color: #1976d2;
        transition: none;
        box-shadow: 0 1px 10px rgba(32, 40, 80, 0.12);
        border: none;
        letter-spacing: 0.03em;
      }
      .footer {
        background-color: #f8f9fa;
        padding: 30px 20px;
        text-align: center;
        border-top: 1px solid #e9ecef;
      }
      .footer p {
        margin: 5px 0;
        font-size: 14px;
        color: #6c757d;
      }
      .footer-brand {
        font-weight: 700;
        color: #667eea;
        font-size: 16px;
      }
      .unsubscribe {
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid #dee2e6;
      }
      .unsubscribe a {
        color: #999;
        text-decoration: none;
        font-size: 12px;
      }
      .unsubscribe a:hover {
        text-decoration: underline;
      }
      @media only screen and (max-width: 600px) {
        .header h1 {
          font-size: 24px;
        }
        .product-image {
          height: 220px;
        }
        .product-title {
          font-size: 15px;
        }
        .current-price {
          font-size: 28px;
        }
        table[class="product-grid"] td {
          display: block !important;
          width: 100% !important;
          padding: 10px 5px !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="email-container">
      <!-- Header -->
      <div class="header">
        <h1>{{ title }}</h1>
      </div>

      <!-- Intro -->
      <div class="intro">
        <p>🔥 As melhores ofertas selecionadas para você!</p>
      </div>

      <!-- Products -->
      <div class="products-container">{{ content|safe }}</div>

      <!-- Footer -->
      <div class="footer">
        <p class="footer-brand">OfertaBR</p>
        <p>As melhores ofertas na sua caixa de entrada</p>
        <div class="unsubscribe">
          <p>
            Não deseja mais receber nossas newsletters?<br />
            <a href="{{ unsubscribe_url }}">Cancelar inscrição</a>
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
